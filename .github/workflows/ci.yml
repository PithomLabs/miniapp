name: ci

# Phase 0 CI skeleton: build, vet, and tests with strict policy mode.
# Unverified until the first push runs it; local `go test ./...` covers
# the same gates meanwhile. Runners need Go 1.26+ and no overrides.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MINIAPP_POLICY: strict
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: out=$(gofmt -l .); rc=$?; if [ $rc -ne 0 ]; then echo "gofmt execution failed"; exit $rc; fi; test -z "$out"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./contract/ ./internal/... ./spikes/
      - run: bash scripts/checks.sh
